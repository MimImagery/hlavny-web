<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editorial & Press | MIM IMAGERY</title>
    <style>
        body { background-color: #FDFBF7; color: #2B1E17; font-family: 'Didot', serif; text-align: center; padding: 60px 20px; margin: 0; }
        h1 { font-weight: 300; text-transform: uppercase; letter-spacing: 3px; font-size: 2rem; margin-bottom: 10px; }
        .subtitle { font-style: italic; color: #766355; font-size: 1rem; letter-spacing: 1px; margin-bottom: 50px; }
        
        .photo-container { max-width: 900px; margin: 0 auto 60px auto; text-align: center; }
        img { max-width: 900px; width: 100%; height: auto; border: 1px solid #C6B9A8; display: block; margin: 0 auto 15px auto; }
        
        .caption { font-size: 0.95rem; letter-spacing: 1px; color: #503E35; margin-bottom: 5px; }
        .magazine-info { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #A38F75; font-weight: bold; }
        
        .back-link { display: inline-block; margin-top: 20px; padding: 12px 30px; border: 1px solid #2B1E17; color: #2B1E17; text-decoration: none; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <h1>The Editorial Selection</h1>
    <div class="subtitle">As featured in international press</div>

    <!-- Prvá fotografia: Mattheo -->
    <div class="photo-container">
        <img src="mattheo.jpg" alt="Mattheo - International Kid Model Magazine">
        <div class="caption">Mattheo | Age 14 days | Slovakia</div>
        <div class="magazine-info">Published in International Kid Model Magazine (USA)</div>
    </div>

    <!-- Druhá fotografia: Auri -->
    <div class="photo-container">
        <img src="auri.jpg" alt="Auri - International Kid Model Magazine">
        <div class="caption">Auri | Age 14 days | Slovakia</div>
        <div class="magazine-info">Published in International Kid Model Magazine (USA)</div>
    </div>

    <!-- Tlačidlo Späť -->
    <a href="#" class="back-link" onclick="history.back(); return false;">[ Back to Portfolio ]</a>

</body>
</html>
